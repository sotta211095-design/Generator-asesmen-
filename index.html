<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Generator Soal SAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#dcdad2;--ac:#b45309;--act:#fff;--ok:#e3f1e3;--soft:#faf9f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#eeece6;--mut:#a3a199;--bd:#3b3a36;--ac:#f59e0b;--act:#1b1b19;--ok:#22331f;--soft:#1d1d1b}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#eeece6;--mut:#a3a199;--bd:#3b3a36;--ac:#f59e0b;--act:#1b1b19;--ok:#22331f;--soft:#1d1d1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
.hero{padding:6px 2px 14px}h1{font-size:1.5rem;margin:0}.sub{color:var(--mut);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center}.card h3 b{background:var(--ac);color:var(--act);border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:.8rem}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--soft);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--ac);color:var(--act)}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:default}
details summary{cursor:pointer;font-weight:600}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips button{padding:5px 10px;font-size:.8rem;font-weight:500}
.big{width:100%;margin-top:14px;padding:14px;font-size:1.05rem}#st{margin:10px 0 0;color:var(--mut);min-height:1.4em}.err{color:#dc2626}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap}
.paper{background:#fff;color:#111;border:1px solid var(--bd);border-radius:6px;padding:22px 20px;font:15px/1.65 "Times New Roman",Times,serif;box-shadow:0 2px 14px #0002}
.paper h2{font-size:1rem;margin:14px 0 2px}.q{position:relative;margin:0 0 16px;padding-right:4px}
.q .stim{margin-left:1.7em}.q .st{margin-left:1.7em;margin-top:3px}.q .o{margin-left:2.6em;text-indent:-1.3em;padding-left:1.3em}
.showkey .o.k{font-weight:700;background:var(--ok);border-radius:4px}.q .kn{display:none;margin-left:1.7em;color:#555;font-size:.88rem}.showkey .kn{display:block}
.tb{display:flex;gap:4px;margin:4px 0 0 1.7em}.tb button{padding:2px 8px;font-size:.75rem;font-weight:500;background:#eee;color:#333;border:1px solid #ccc}
.paper table{border-collapse:collapse;margin:4px 0 6px 1.7em;font-size:.93rem}.paper th,.paper td{border:1px solid #444;padding:3px 8px;text-align:left}.paper th{background:#eee}
.fig{display:block;margin:4px 0 6px 1.7em;max-width:calc(100% - 1.7em);height:auto;border:1px solid #ddd}.line{border-bottom:1px dotted #777;height:1.7em;margin-left:1.7em}
</style></head><body><main>
<div class="hero"><h1>📝 Generator Soal SAS</h1><p class="sub">Buat naskah soal siap cetak berformat SAS (.docx), lengkap dengan kunci dan kisi-kisi.</p></div>

<div class="card"><details id="idn"><summary>① Identitas naskah (tersimpan otomatis)</summary>
<label>Kop instansi</label><input id="kop" value="PEMERINTAH KABUPATEN PANGKAJENE DAN KEPULAUAN">
<div class="g2"><div><label>KKG</label><input id="kkg" placeholder="nama gugus/KKG"></div><div><label>Wilayah</label><input id="wil" placeholder="wilayah"></div></div>
<div class="g3"><div><label>Mata pelajaran</label><select id="mps"></select><input id="mp" value="IPAS" style="margin-top:6px"></div><div><label>Kelas</label><select id="kl"><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option selected>VI</option></select></div><div><label>Semester</label><select id="sm"><option>Ganjil</option><option>Genap</option></select></div></div>
<div class="g3"><div><label>Tahun pelajaran</label><input id="th" value="2026/2027"></div><div><label>Alokasi waktu</label><input id="aw" value="90 menit"></div><div><label>Hari/Tanggal</label><input id="hr"></div></div>
<label>Jenjang</label><input id="jj" value="SD/MI">
<label>Logo (opsional, PNG/JPG)</label><input id="lg" type="file" accept="image/png,image/jpeg"></details></div>

<div class="card"><h3><b>1</b> Materi yang diujikan</h3>
<textarea id="tp" placeholder="Tulis tujuan pembelajaran / materi, satu per baris. Contoh:&#10;6.1 Sistem saraf, sistem gerak, dan pubertas&#10;6.2 Krisis energi dan oven surya"></textarea>
<label>Bahan ajar / teks sumber (opsional)</label><textarea id="src" placeholder="Tempel ringkasan materi, ATP, atau teks bacaan. Jika diisi, soal dibuat berdasarkan bahan ini agar sesuai yang Anda ajarkan."></textarea><div class="chips" id="ch"></div>
<h3 style="margin-top:16px"><b>2</b> Jumlah dan tingkat soal</h3>
<div class="g3"><div><label>Pilihan ganda</label><input id="npg" type="number" min="1" max="40" value="10"></div><div><label>Uraian</label><input id="nur" type="number" min="0" max="8" value="2"></div><div><label>PG bergambar</label><input id="ngb" type="number" min="0" max="15" value="0"></div></div>
<label>Tingkat kesulitan</label><select id="lv"><option value="sangat mudah: jawaban dapat langsung dibaca dari stimulus">Sangat mudah</option><option value="mudah: perlu satu langkah berpikir sederhana" selected>Mudah</option><option value="sedang: perlu membandingkan atau menyimpulkan dari stimulus">Sedang</option></select>
<label style="display:flex;gap:8px;align-items:center;font-weight:500;margin-top:12px"><input id="vf" type="checkbox" checked style="width:auto"> Uji kunci otomatis (lebih akurat, tambah sekitar 1 menit)</label><button class="big" id="go">✨ Buat Soal</button><select id="hs" style="margin-top:10px"><option value="">🕘 Riwayat soal tersimpan…</option></select><div id="st"></div></div>

<div id="out" hidden>
<div class="bar"><button class="sec" id="tk">👁 Kunci</button><button class="sec" id="rv">🔍 Periksa &amp; perbaiki</button><button id="d1">⬇ Naskah .docx</button><button id="d2">⬇ Kunci .docx</button><button class="sec" id="re">🔄 Ulang semua</button></div>
<div class="paper" id="paper"></div></div>

<script>
const $=i=>document.getElementById(i);let D=null,sample=null,logo=null;const L='ABCD';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=['kop','kkg','wil','mp','kl','sm','th','aw','hr','jj','tp','npg','nur','ngb','lv'];
try{const s=JSON.parse(localStorage.getItem('gs')||'{}');F.forEach(k=>{if(s[k]!=null)$(k).value=s[k]})}catch(e){}
function save(){try{localStorage.setItem('gs',JSON.stringify(Object.fromEntries(F.map(k=>[k,$(k).value]))))}catch(e){}}
F.forEach(k=>$(k).addEventListener('change',save));
[['IPAS Kelas 6','6.1 Sistem saraf, sistem gerak, pubertas dan pola hidup sehat\n6.2 Krisis energi, oven surya, dan solusi hemat energi\n6.3 Keragaman budaya, kearifan lokal, dan toleransi'],['Matematika','Bilangan cacah, pecahan, dan pengukuran sederhana'],['Bahasa Indonesia','Membaca teks cerita, ide pokok, dan kosakata']].forEach(([n,t])=>{const b=document.createElement('button');b.className='sec';b.textContent=n;b.onclick=()=>{$('tp').value=t;save()};$('ch').appendChild(b)});
$('lg').onchange=async e=>{const f=e.target.files[0];if(!f){logo=null;return}const u=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});const im=await new Promise(r=>{const i=new Image;i.onload=()=>r(i);i.src=u});logo={d:Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0)),ext:f.type.includes('png')?'png':'jpeg',w:im.naturalWidth,h:im.naturalHeight}};
(async()=>{try{sample=await claude.use('sample')}catch(e){}if(!sample){$('go').disabled=true;$('st').innerHTML='<span class="err">Pembuat soal hanya aktif saat halaman dibuka lewat Claude.</span>'}})();

/* ---------- gambar ---------- */
function cleanSvg(s){if(typeof s!=='string'||!/^\s*<svg[\s>]/i.test(s))return null;s=s.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'').replace(/(xlink:)?href\s*=\s*("[^"]*"|'[^']*')/gi,'');
 if(!/xmlns=/.test(s))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');const m=s.match(/viewBox="\s*[\d.-]+[ ,]+[\d.-]+[ ,]+([\d.]+)[ ,]+([\d.]+)/);if(m&&!/<svg[^>]*\swidth=/.test(s))s=s.replace(/<svg/i,`<svg width="${m[1]}" height="${m[2]}"`);return s}
const figUrl=q=>{if(q.foto)return q.foto.url;const s=cleanSvg(q.gambar);return s?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s):''};
function toPng(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const w=1000,h=Math.round(w*(i.naturalHeight||300)/(i.naturalWidth||600));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);c.toBlob(async b=>res({d:new Uint8Array(await b.arrayBuffer()),w,h}),'image/png')};i.onerror=rej;i.src=src})}

/* ---------- pratinjau ---------- */
function stimHtml(s){if(!s)return'';let h='';if(s.header&&s.baris)h+='<table><tr>'+s.header.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+s.baris.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';if(s.teks)h+='<div class="stim">'+esc(s.teks)+'</div>';return h}
const parts=q=>Array.isArray(q.soal)?q.soal:[q.soal||''];
function render(){fixAll();let n=0;const tb=(k,i)=>`<div class="tb"><button data-a="re" data-k="${k}" data-i="${i}">🔄 Ulang soal ini</button><button data-a="del" data-k="${k}" data-i="${i}">🗑 Hapus</button>${k==='pg'?`<button data-a="gam" data-k="${k}" data-i="${i}">🖼 Gambar AI</button><button data-a="foto" data-k="${k}" data-i="${i}">📎 Gambar sendiri</button>`:''}</div>`;
 let h='<h2>A. PILIHAN GANDA</h2><i>Pilih jawaban yang tepat: A, B, C, atau D!</i><br><br>';
 (D.pg||[]).forEach((q,i)=>{n++;const f=figUrl(q);h+='<div class="q"><div class="stim">'+esc(q.intro||'Bacalah stimulus berikut!')+'</div>'+stimHtml(q.stimulus)+(f?'<img class="fig" width="400" alt="Gambar soal" src="'+f+'">':'')+'<div class="st">'+n+'. '+esc(q.soal)+'</div>'+(q.opsi||[]).slice(0,4).map((o,j)=>'<div class="o'+(L[j]===q.kunci?' k':'')+'">'+L[j]+'. '+esc(o)+'</div>').join('')+'<div class="kn">Kunci: '+esc(q.kunci)+(q.pembahasan?' — '+esc(q.pembahasan):'')+'</div>'+tb('pg',i)+'</div>'});
 if((D.uraian||[]).length){h+='<h2>B. URAIAN</h2><i>Jawablah dengan singkat dan jelas!</i><br><br>';D.uraian.forEach((q,i)=>{n++;const p=parts(q);h+='<div class="q"><div class="stim">'+esc(q.intro||'Bacalah stimulus berikut!')+'</div>'+stimHtml(q.stimulus)+'<div class="st">'+n+'. '+(p.length>1?'Jawablah pertanyaan berikut!':esc(p[0]))+'</div>'+(p.length>1?p.map((x,j)=>'<div class="o">'+'ab'[j]+'. '+esc(String(x).replace(/^[a-z]\.\s*/,''))+'</div><div class="line"></div><div class="line"></div>').join(''):'<div class="line"></div><div class="line"></div><div class="line"></div>')+'<div class="kn">Kunci: '+esc(q.kunci)+' | Skor: '+esc(q.rubrik||'maks. 4')+'</div>'+tb('ur',i)+'</div>'})}
 $('paper').innerHTML=h;$('out').hidden=false}
$('paper').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const k=b.dataset.k==='pg'?'pg':'uraian',i=+b.dataset.i;
 if(b.dataset.a==='del'){D[k].splice(i,1);render();return}
 if(b.dataset.a==='foto'){await pickFoto(i);render();return}
 if(b.dataset.a==='gam'){b.disabled=true;b.textContent='⏳ …';try{const q=D.pg[i];const r=await sample.json(`${ctx()}\nBuat HANYA diagram (field "diagram") yang paling jelas dan membantu untuk soal ini; jawaban dan kunci tidak boleh berubah dan jawaban harus bisa ditemukan dari stimulus/diagram: ${JSON.stringify({soal:q.soal,opsi:q.opsi,kunci:q.kunci,stimulus:q.stimulus,diagram:q.diagram})}\n${rules()}\nBalas HANYA JSON: {"diagram":{...}}`,{modelTier:'default',cache:false});if(r&&drawDiagram(r.diagram)){q.diagram=r.diagram;delete q.gambar;delete q.foto}}catch(x){}render();return}
 b.disabled=true;b.textContent='⏳ …';try{const old=D[k][i];const r=await sample.json(`${ctx()}\nBuat SATU soal ${k==='pg'?'pilihan ganda':'uraian'} pengganti yang berbeda dari soal ini (topik boleh sama, stimulus dan pertanyaan harus baru): ${JSON.stringify({tp:old.tp,indikator:old.indikator})}.${old.gambar?' Soal ini bergambar (sertakan field gambar SVG).':''}\n${rules()}\nBalas HANYA satu objek JSON soal tersebut (bukan array).`,{modelTier:'default',cache:false});D[k][i]=Array.isArray(r)?r[0]:r;if(k==='pg')balance();render()}catch(x){b.textContent='Gagal';b.disabled=false}};

const mk=(c)=>({t:'cerita situasi, tabel kegiatan, kutipan teks pendek',f:'ajaran dan kisah hanya yang pasti benar dan umum dikenal; hindari perbedaan pendapat; fokus akhlak, kisah, ibadah, dan penerapan sehari-hari',c});
const SUBJ={'IPAS':{t:'cerita fenomena, tabel data, diagram/gambar bagian berlabel, grafik sederhana',f:'sains dan sosial SD; fakta harus benar; kaitkan dengan pengamatan atau percobaan sederhana',c:'Sistem gerak manusia; sumber energi; keragaman budaya'},
'Matematika':{t:'soal cerita konteks sehari-hari, tabel, diagram batang, gambar bangun, garis bilangan',f:'angka kecil dan mudah, satu atau dua langkah hitung; hitung ulang sebelum menetapkan kunci; pengecoh berasal dari kesalahan hitung yang umum',c:'Penjumlahan dan pengurangan; pecahan; keliling dan luas'},
'Bahasa Indonesia':{t:'teks bacaan pendek (cerita, pengumuman, berita, puisi pendek), jadwal, kutipan',f:'pemahaman bacaan: ide pokok, informasi tersurat, kosakata, kalimat efektif; ejaan sesuai PUEBI',c:'Ide pokok paragraf; teks cerita; kosakata'},
'Pendidikan Pancasila':{t:'cerita situasi sehari-hari, tabel kegiatan, poster',f:'nilai Pancasila, aturan, hak dan kewajiban, gotong royong, kebinekaan; ukur sikap dan penerapan, bukan hafalan',c:'Sila Pancasila; aturan di sekolah; kebinekaan'},
'Bahasa Inggris':{t:'dialog singkat, teks deskripsi pendek, tabel jadwal, gambar berlabel',f:'soal dan pilihan dalam bahasa Inggris sederhana, petunjuk tetap bahasa Indonesia; kosakata dasar SD',c:'Greetings; family; daily activities'},
'PJOK':{t:'cerita kegiatan, tabel data kebugaran, gambar gerakan berlabel',f:'gerak dasar, permainan, kebugaran, kesehatan dan keselamatan',c:'Lari dan lompat; permainan bola kecil; kebersihan diri'},
'Seni Rupa':{t:'deskripsi karya, tabel warna, gambar bentuk',f:'unsur seni rupa, warna, garis, bentuk, karya dua dan tiga dimensi',c:'Garis dan bentuk; warna primer; kolase'},
'Seni Musik':{t:'cerita kegiatan bermusik, tabel nada/tempo, notasi sederhana berupa teks',f:'unsur musik, alat musik, lagu daerah dan nasional; jangan menulis lirik berhak cipta',c:'Alat musik; tempo; lagu daerah'},
'Seni Tari':{t:'cerita pertunjukan, tabel unsur gerak, gambar pola lantai',f:'unsur gerak, ruang, waktu, tenaga, tari daerah',c:'Gerak dasar tari; tari daerah'},
'Seni Teater':{t:'cuplikan dialog, cerita pementasan, tabel peran',f:'unsur teater, ekspresi, dialog, peran',c:'Ekspresi dan dialog; peran dalam pementasan'},
'Pendidikan Agama Islam dan Budi Pekerti':mk('Rukun iman; akhlak terpuji; kisah nabi'),'Pendidikan Agama Kristen':mk('Kisah Alkitab; kasih; doa'),'Pendidikan Agama Katolik':mk('Kisah Kitab Suci; kasih; doa'),'Pendidikan Agama Hindu':mk('Tri Hita Karana; hari raya; sloka sederhana'),'Pendidikan Agama Buddha':mk('Tiga Mustika; kebajikan; hari raya'),'Pendidikan Agama Khonghucu':mk('Delapan kebajikan; hari raya; kisah teladan'),
'Bahasa Daerah / Muatan Lokal':{t:'teks pendek bahasa daerah dengan terjemahan, tabel kosakata, cerita rakyat',f:'kosakata dan tata krama berbahasa daerah; hanya bahasa yang pasti benar; sertakan arti dalam bahasa Indonesia bila perlu',c:'Kosakata; salam dan tata krama; cerita rakyat'},
'IPA':{t:'cerita percobaan, tabel data, diagram berlabel, grafik',f:'konsep sains SD; fakta benar',c:'Makhluk hidup; gaya; energi'},'IPS':{t:'cerita kehidupan sosial, tabel data, peta sederhana berupa teks/tabel',f:'lingkungan, ekonomi, sejarah dan budaya setempat',c:'Kegiatan ekonomi; peninggalan sejarah'},'Lainnya':{}};
const FASE={I:'A',II:'A',III:'B',IV:'B',V:'C',VI:'C'},BHS={A:'kalimat sangat pendek (maksimal 8 kata), kata sehari-hari, angka kecil',B:'kalimat pendek (maksimal 12 kata) dan kata yang akrab bagi anak',C:'kalimat pendek dan jelas, istilah dijelaskan di stimulus'};
const ms=$('mps');Object.keys(SUBJ).forEach(n=>ms.add(new Option(n,n)));ms.value=SUBJ[$('mp').value]?$('mp').value:'Lainnya';
ms.onchange=()=>{if(ms.value!=='Lainnya')$('mp').value=ms.value;const c=(SUBJ[ms.value]||{}).c;$('tp').placeholder=c?'Contoh: '+c:'Tulis tujuan pembelajaran / materi, satu per baris';save()};
function subjCtx(){const g=SUBJ[ms.value]||{},f=FASE[$('kl').value];return `Mata pelajaran ${$('mp').value}, kelas ${$('kl').value} ${$('jj').value} (Fase ${f}), semester ${$('sm').value}. Bahasa: ${BHS[f]}.${g.t?` Jenis stimulus yang cocok: ${g.t}.`:''}${g.f?` Pedoman mapel: ${g.f}.`:''}`}
/* ---------- pembuat diagram otomatis ---------- */
const E2=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tx=(x,y,s,fs=16,a='middle',o='')=>`<text x="${x}" y="${y}" font-size="${fs}" text-anchor="${a}" fill="#111" ${o}>${E2(s)}</text>`;
const BD='font-weight="bold"';
function wr(cx,cy,s,mc,fs=15){const w=String(s).split(' '),ls=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>mc&&c){ls.push(c);c=x}else c=(c+' '+x).trim()});if(c)ls.push(c);return ls.map((l,i)=>tx(cx,cy+(i-(ls.length-1)/2)*(fs+4)+fs/3,l,fs)).join('')}
const svgW=(h,b,t)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 ${h}" width="600" height="${h}" font-family="Arial, Helvetica, sans-serif"><rect width="600" height="${h}" fill="#fff"/>${t?tx(300,28,t,18,'middle',BD):''}${b}</svg>`;
const nm=v=>Number(String(v).replace(',','.'));
function drawDiagram(s){try{if(!s||!s.jenis)return null;const J=s.jenis;
 if(J==='alur'){const k=(s.kotak||[]).slice(0,6);if(k.length<2)return null;const n=k.length,g=34,bw=Math.min(120,(560-(n-1)*g)/n),x0=(600-(n*bw+(n-1)*g))/2;let b='';k.forEach((t,i)=>{const x=x0+i*(bw+g),q=String(t).trim()==='?';b+=`<rect x="${x}" y="70" width="${bw}" height="80" rx="8" fill="${q?'#e5e5e5':'#fff'}" stroke="#111" stroke-width="2"/>`+(q?tx(x+bw/2,122,'?',36,'middle',BD):wr(x+bw/2,110,t,Math.floor(bw/8.5)));if(i<n-1)b+=`<line x1="${x+bw+4}" y1="110" x2="${x+bw+g-8}" y2="110" stroke="#111" stroke-width="2"/><polygon points="${x+bw+g-4},110 ${x+bw+g-15},104 ${x+bw+g-15},116" fill="#111"/>`});return svgW(190,b,s.judul)}

const rules=()=>`ATURAN MUTU:
1. Setiap soal wajib punya stimulus yang BERFUNGSI: teks cerita pendek 1-3 kalimat, tabel kecil (2-5 baris), atau gambar. Uji hapus-stimulus: bila stimulus dibuang, soal tidak boleh bisa dijawab dengan tepat. Jawaban harus diambil/dihitung dari data di stimulus (membaca angka, membandingkan dua data, mencari alasan dalam teks, memakai keterangan huruf pada gambar). Jangan membuat soal hafalan murni.

3. Satu jawaban benar, tiga pengecoh masuk akal tetapi jelas salah. Hindari opsi "semua benar" dan "tidak ada yang benar". Panjang opsi seimbang.
